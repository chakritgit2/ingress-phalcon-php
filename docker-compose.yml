services:
  app:
    build: .
    image: ingress-selfservice:latest
    container_name: ingress-app
    env_file: .env
    volumes:
      # DEV-ONLY: bind-mounts app/ so edits to controllers/services/views/etc.
      # show up without a rebuild. Harmless in prod too (same content as the
      # image), but only worth the mount for local iteration.
      - ./app:/app/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ingress-web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: ingress-db
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # DEV-ONLY: DB browser GUI for the local mockup, not part of the app itself.
  adminer:
    image: adminer:latest
    container_name: ingress-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql-data:
