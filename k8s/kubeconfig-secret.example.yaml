# Copy to kubeconfig-secret.yaml, fill in real values, and DO NOT commit the
# filled-in version. Apply with: kubectl apply -f k8s/kubeconfig-secret.yaml
#
# The token below MUST belong to the `ingress-selfservice` ServiceAccount
# (see serviceaccount.yaml/clusterrole.yaml/clusterrolebinding.yaml) — this
# file is how that ServiceAccount's identity reaches the app, since the app
# reads Kubernetes credentials from a kubeconfig file path (SERVER_CONFIG),
# not from the automatic ServiceAccount token mount.
#
# Generate a long-lived token for the ServiceAccount (Kubernetes 1.24+ no
# longer auto-creates one):
#   kubectl create token ingress-selfservice -n ingress-selfservice --duration=8760h
# Get the cluster CA (base64) and API server address:
#   kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
#   kubectl config view --raw -o jsonpath='{.clusters[0].cluster.server}'
apiVersion: v1
kind: Secret
metadata:
  name: ingress-selfservice-kubeconfig
  namespace: ingress-selfservice
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    current-context: ingress-selfservice
    clusters:
      - name: default
        cluster:
          server: https://CHANGE_ME:6443
          certificate-authority-data: CHANGE_ME_BASE64_CA
    users:
      - name: ingress-selfservice
        user:
          token: CHANGE_ME_SERVICEACCOUNT_TOKEN
    contexts:
      - name: ingress-selfservice
        context:
          cluster: default
          user: ingress-selfservice
