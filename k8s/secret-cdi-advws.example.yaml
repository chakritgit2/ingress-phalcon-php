# Copy to secret-cdi-advws.yaml, fill in the real DB_PASS (matches the
# live `ingress-phalcon-php` Deployment in namespace cdi-advws), and DO NOT
# commit the filled-in version. Apply with:
#   kubectl apply -f k8s/secret-cdi-advws.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ingress-phalcon-php-secrets
  namespace: cdi-advws
type: Opaque
stringData:
  DB_PASS: "CHANGE_ME"
