apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-selfservice-config
  namespace: ingress-selfservice
data:
  K8S_NODE_IP: "192.168.33.31"
  BASE_URI: "/"
  GOOGLE_HD: "advws.com"
  GOOGLE_REDIRECT_URI: "http://192.168.33.31:PLACEHOLDER/login/google/callback"
  # This deployment is reached via a plain IP:NodePort with no domain/TLS —
  # do not remove this or the session cookie's Secure flag comes back on
  # (see app/config/services.php) and login silently stops working, since
  # browsers drop Secure cookies on a non-HTTPS origin. Only set this to "0"
  # for a deployment that is genuinely HTTP-only forever, like this one.
  APP_HTTPS: "0"
  # GOOGLE_CLIENT_ID is not secret by Google's own design, but is kept in
  # secret.example.yaml alongside its paired client_secret for simplicity —
  # move it here instead if you'd rather keep the Secret to true secrets only.
