apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingress-selfservice-sweeper
  namespace: ingress-selfservice
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ingress-selfservice
          restartPolicy: OnFailure
          containers:
            - name: sweeper
              image: registry.example.com/ingress-selfservice:latest
              # ; not && — each step must still run even if an earlier one
              # fails outright (e.g. a transient DB error), so one broken
              # step doesn't silently stop the rest. pruneExpired runs before
              # scheduledClose/scheduledReopen so a row whose TTL just
              # lapsed is already flipped to 'expired' before the nightly
              # schedule looks at it in the same tick — the TTL always wins
              # over the 19:00/08:30 cycle.
              command: ["sh", "-c", "php app/console.php kubernetes processCommands; php app/console.php kubernetes pruneExpired; php app/console.php kubernetes scheduledClose; php app/console.php kubernetes scheduledReopen"]
              env:
                - name: SERVER_CONFIG
                  value: /etc/ingress-selfservice/kubeconfig
              envFrom:
                - configMapRef:
                    name: ingress-selfservice-config
                - secretRef:
                    name: ingress-selfservice-secrets
              volumeMounts:
                - name: kubeconfig
                  mountPath: /etc/ingress-selfservice
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: kubeconfig
              secret:
                secretName: ingress-selfservice-kubeconfig
