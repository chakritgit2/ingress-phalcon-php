# Copy to secret.yaml, fill in real values, and DO NOT commit the filled-in
# version. Apply with: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ingress-selfservice-secrets
  namespace: ingress-selfservice
type: Opaque
stringData:
  DB_HOST: "mysql.example.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "ingress_selfservice"
  DB_USER: "ingress_selfservice"
  DB_PASSWORD: "CHANGE_ME"
  GOOGLE_CLIENT_ID: "CHANGE_ME.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  COOKIE_SIGN_KEY: "CHANGE_ME_RANDOM_32_BYTES"
